{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="text-center mb-10">
        <h1 class="text-4xl font-extrabold text-gray-900 dark:text-white mb-4">Pide tu Pieza Personalizada</h1>
        <p class="text-xl text-gray-600 dark:text-gray-400">Cuéntanos tu idea, medidas o adjunta una referencia. Nos pondremos en contacto contigo por WhatsApp para pasarte un presupuesto.</p>
    </div>

    <div class="bg-white dark:bg-dark border border-gray-200 dark:border-gray-800 shadow-2xl rounded-2xl p-8">
        <form id="custom-order-form" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tu Nombre</label>
                    <input type="text" id="co_name" required class="form-input w-full rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white border-gray-300 dark:border-gray-700 focus:border-primary focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Color deseado (opcional)</label>
                    <input type="text" id="co_color" placeholder="Ej. Negro, Rojo..." class="form-input w-full rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white border-gray-300 dark:border-gray-700 focus:border-primary focus:ring-primary">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">¿Qué necesitas imprimir? (Descripción detallada)</label>
                <textarea id="co_desc" rows="4" required placeholder="Describe la pieza, medidas aproximadas, si es para interior/exterior, etc." class="form-textarea w-full rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white border-gray-300 dark:border-gray-700 focus:border-primary focus:ring-primary"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Enlace de referencia (Opcional)</label>
                <input type="url" id="co_url" placeholder="Enlace a Thingiverse, MakerWorld, Printables..." class="form-input w-full rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white border-gray-300 dark:border-gray-700 focus:border-primary focus:ring-primary">
                <p class="text-xs text-gray-500 mt-1">Si tienes el archivo 3D o lo has visto en internet, pega aquí el enlace.</p>
            </div>

            <button type="button" id="send-whatsapp-btn" class="w-full mt-6 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-lg transform hover:scale-[1.02] flex justify-center items-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                Enviar por WhatsApp
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('send-whatsapp-btn').addEventListener('click', function() {
        const name = document.getElementById('co_name').value.trim();
        const color = document.getElementById('co_color').value.trim();
        const desc = document.getElementById('co_desc').value.trim();
        const url = document.getElementById('co_url').value.trim();
        
        if(!name || !desc) {
            alert('Por favor, indica al menos tu nombre y qué necesitas.');
            return;
        }
        
        // Número de teléfono de la empresa (configurarlo aquí)
        // Usa el formato internacional sin + ni 00. Ej para España: 34600000000
        const telefonoEmpresa = "34600000000"; 
        
        let mensaje = `👋 Hola ProPrint3D, soy *${name}*.\n\nMe gustaría pedir un presupuesto para una pieza personalizada:\n\n*Descripción:*\n${desc}\n`;
        
        if (color) {
            mensaje += `\n*Color deseado:* ${color}`;
        }
        
        if (url) {
            mensaje += `\n*Enlace de referencia:* ${url}`;
        }
        
        mensaje += `\n\n¿Me podríais dar precio y tiempos aproximados? Gracias.`;
        
        const urlEncoded = encodeURIComponent(mensaje);
        const whatsappUrl = `https://wa.me/${telefonoEmpresa}?text=${urlEncoded}`;
        
        window.open(whatsappUrl, '_blank');
    });
</script>
{% endblock %}
